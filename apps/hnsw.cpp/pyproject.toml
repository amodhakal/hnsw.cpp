[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "hnsw-cpp"
version = "0.1.0"
description = "C++ implementation of HNSW approximate nearest-neighbour search"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Amodh Dhakal", email = "amodhakal@gmail.com" }
]

[tool.scikit-build]
cmake.build-type = "Release"
build-dir = "build"
editable.rebuild = true
editable.verbose = false
wheel.packages = []
