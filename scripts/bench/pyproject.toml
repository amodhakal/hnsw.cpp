[project]
name = "vecsearch-bench"
version = "0.1.0"
description = "Local recall vs QPS benchmarks for vector search libraries"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
    "hnswlib",
]

[project.scripts]
vecbench = "bench.cli:main"

[tool.uv.sources]
hnswlib = { path = "../../vendors/hnswlib" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bench"]
